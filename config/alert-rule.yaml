apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: krag-demo-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus
    app: kube-prometheus-stack
    app.kubernetes.io/part-of: kube-prometheus-stack
spec:
  groups:
    - name: krag-demo.rules
      interval: 15s
      rules:
        - alert: PodCrashLooping
          expr: |
            kube_pod_container_status_restarts_total{
              namespace="krag-demo",
              pod=~"crasher-.*"
            } >= 3
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash looping ({{ $value }} restarts)"
            description: >
              Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted
              {{ $value }} times. The container ({{ $labels.container }}) is likely
              being OOMKilled due to a memory leak. kRAG will investigate and attempt
              automated remediation. Check logs with:
              kubectl logs {{ $labels.pod }} -n {{ $labels.namespace }} --previous

        - alert: FrontendCPUHigh
          expr: |
            avg by (owner_name, namespace) (
              (
                rate(container_cpu_usage_seconds_total{namespace="prod", container="nginx"}[1m])
                / on(pod)
                kube_pod_container_resource_limits{resource="cpu", namespace="prod", container="nginx"}
                * 100 > 80
              )
              * on(pod) group_left(owner_name) 
              label_replace(kube_pod_owner{owner_kind="ReplicaSet", namespace="prod"}, "owner_name", "$1", "owner_name", "(.*)-[a-f0-9]+$")
            )
          for: 2m
          labels:
            severity: critical
            namespace: prod
          annotations:
            summary: "High CPU usage on frontend pod: {{ $labels.owner_name }}"
            description: >
              Pod {{ $labels.owner_name }} in namespace 'prod' has exceeded 80% of its assigned 
              CPU limit. Current average utilization is {{ $value | printf "%.2f" }}%.
              In this case, you should create a new pod with the same configuration to handle the load.
