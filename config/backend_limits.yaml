apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
      - name: api-service
        image: python:3.11-slim
        command: ["/bin/sh", "-c", "sleep infinity"]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi